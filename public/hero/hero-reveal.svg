<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="t">
<title id="t">Abstract digital design workspace</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#161311"/><stop offset=".55" stop-color="#0a0a0a"/><stop offset="1" stop-color="#1f1612"/>
  </linearGradient>
  <radialGradient id="gA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="rgba(207,128,71,0.55)"/><stop offset="1" stop-color="rgba(207,128,71,0.55)" stop-opacity="0"/></radialGradient>
  <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="rgba(177,95,44,0.45)"/><stop offset="1" stop-color="rgba(177,95,44,0.45)" stop-opacity="0"/></radialGradient>
  <radialGradient id="gC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="rgba(151,80,31,0.25)"/><stop offset="1" stop-color="rgba(151,80,31,0.25)" stop-opacity="0"/></radialGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb27a"/><stop offset="1" stop-color="#cf8047"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#161311" stop-opacity="0"/><stop offset="1" stop-color="#161311" stop-opacity="0.9"/></linearGradient>
  <clipPath id="screen"><rect x="1010" y="268" width="760" height="520" rx="26"/></clipPath>
  <clipPath id="phone"><rect x="1618" y="560" width="226" height="470" rx="34"/></clipPath>
</defs>
<rect width="1920" height="1200" fill="url(#bg)"/>
<path d="M0 0V1200M96 0V1200M192 0V1200M288 0V1200M384 0V1200M480 0V1200M576 0V1200M672 0V1200M768 0V1200M864 0V1200M960 0V1200M1056 0V1200M1152 0V1200M1248 0V1200M1344 0V1200M1440 0V1200M1536 0V1200M1632 0V1200M1728 0V1200M1824 0V1200M1920 0V1200M0 0H1920M0 96H1920M0 192H1920M0 288H1920M0 384H1920M0 480H1920M0 576H1920M0 672H1920M0 768H1920M0 864H1920M0 960H1920M0 1056H1920M0 1152H1920" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/>
<ellipse cx="1480" cy="380" rx="760" ry="560" fill="url(#gA)"/>
<ellipse cx="420" cy="1040" rx="620" ry="420" fill="url(#gB)"/>
<ellipse cx="300" cy="200" rx="520" ry="380" fill="url(#gC)"/>

<!-- editorial type specimen, far left -->
<text x="140" y="430" font-family="Onest, Inter, Helvetica, Arial, sans-serif" font-size="300" font-weight="700" letter-spacing="-18" fill="#ffffff" opacity="0.08">Aa</text>
<path d="M140 470H640" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
<path d="M140 520H420M140 560H520M140 600H360" stroke="rgba(255,255,255,0.10)" stroke-width="10" stroke-linecap="round"/>

<!-- colour swatch strip -->
<g transform="translate(140 760)">
  <rect x="0" y="0" width="70" height="70" rx="20" fill="#ffffff" stroke="rgba(255,255,255,0.18)"/><rect x="86" y="0" width="70" height="70" rx="20" fill="#cf8047" stroke="rgba(255,255,255,0.18)"/><rect x="172" y="0" width="70" height="70" rx="20" fill="#ffb27a" stroke="rgba(255,255,255,0.18)"/><rect x="258" y="0" width="70" height="70" rx="20" fill="#3a3430" stroke="rgba(255,255,255,0.18)"/><rect x="344" y="0" width="70" height="70" rx="20" fill="#111111" stroke="rgba(255,255,255,0.18)"/>
</g>
<path d="M140 880H760" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
<path d="M140 930H600M140 970H480" stroke="rgba(255,255,255,0.10)" stroke-width="10" stroke-linecap="round"/>

<!-- browser window -->
<g transform="rotate(-4 1390 528)">
  <rect x="1002" y="260" width="776" height="536" rx="30" fill="rgba(0,0,0,0.6)" opacity="0.6" transform="translate(10 22)"/>
  <rect x="1010" y="268" width="760" height="520" rx="26" fill="#141414" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
  <g clip-path="url(#screen)">
    <rect x="1010" y="268" width="760" height="56" fill="#1c1c1c"/>
    <circle cx="1046" cy="296" r="7" fill="#3a3430"/><circle cx="1070" cy="296" r="7" fill="#3a3430"/><circle cx="1094" cy="296" r="7" fill="#3a3430"/>
    <rect x="1230" y="284" width="320" height="24" rx="12" fill="#2a2724"/>
    <!-- nav -->
    <rect x="1050" y="360" width="84" height="16" rx="8" fill="#ffffff"/>
    <rect x="1420" y="360" width="46" height="16" rx="8" fill="#3a3430"/>
    <rect x="1484" y="360" width="46" height="16" rx="8" fill="#3a3430"/>
    <rect x="1550" y="350" width="150" height="36" rx="18" fill="#ffffff"/>
    <!-- hero copy -->
    <rect x="1050" y="430" width="300" height="34" rx="10" fill="#ffffff"/>
    <rect x="1050" y="476" width="240" height="34" rx="10" fill="url(#acc)"/>
    <rect x="1050" y="534" width="330" height="12" rx="6" fill="#3a3430"/>
    <rect x="1050" y="558" width="260" height="12" rx="6" fill="#3a3430"/>
    <rect x="1050" y="604" width="140" height="42" rx="21" fill="#ffffff"/>
    <rect x="1206" y="604" width="140" height="42" rx="21" fill="none" stroke="#ffffff" stroke-width="2"/>
    <!-- hero art -->
    <rect x="1440" y="420" width="290" height="230" rx="22" fill="rgba(207,128,71,0.32)"/>
    <circle cx="1585" cy="535" r="74" fill="url(#acc)"/>
    <rect x="1470" y="580" width="110" height="50" rx="14" fill="#141414" stroke="rgba(255,255,255,0.16)"/>
    <!-- cards -->
    <rect x="1050" y="690" width="210" height="140" rx="18" fill="#2a2724"/>
    <rect x="1280" y="690" width="210" height="140" rx="18" fill="#2a2724"/>
    <rect x="1510" y="690" width="210" height="140" rx="18" fill="#2a2724"/>
  </g>
</g>

<!-- floating chips -->
<g transform="translate(900 820) rotate(-6)">
  <rect width="250" height="64" rx="32" fill="#1c1c1c" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="34" cy="32" r="12" fill="url(#acc)"/>
  <rect x="60" y="24" width="150" height="16" rx="8" fill="#3a3430"/>
</g>
<g transform="translate(1180 160) rotate(5)">
  <rect width="210" height="64" rx="32" fill="#1c1c1c" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="24" y="24" width="90" height="16" rx="8" fill="#ffffff"/>
  <rect x="126" y="24" width="60" height="16" rx="8" fill="#3a3430"/>
</g>

<!-- phone -->
<g transform="rotate(6 1731 795)">
  <rect x="1606" y="548" width="250" height="494" rx="46" fill="#f1f0ee"/>
  <g clip-path="url(#phone)">
    <rect x="1618" y="560" width="226" height="470" fill="#111111"/>
    <rect x="1700" y="576" width="62" height="12" rx="6" fill="#f1f0ee"/>
    <rect x="1646" y="630" width="120" height="18" rx="9" fill="#ffffff"/>
    <rect x="1646" y="660" width="170" height="10" rx="5" fill="#3a3430"/>
    <rect x="1646" y="678" width="130" height="10" rx="5" fill="#3a3430"/>
    <rect x="1646" y="712" width="170" height="120" rx="18" fill="url(#acc)"/>
    <rect x="1646" y="852" width="80" height="80" rx="16" fill="#2a2724"/>
    <rect x="1736" y="852" width="80" height="80" rx="16" fill="#2a2724"/>
    <rect x="1646" y="950" width="170" height="40" rx="20" fill="#ffffff"/>
  </g>
</g>

<!-- cursor with click rays -->
<g transform="translate(1322 652)">
  <path d="M-34 -58 -46 -70M0 -72V-90M34 -58 46 -70" stroke="#ffb27a" stroke-width="8" stroke-linecap="round"/>
  <path d="M0 -40 46 40 12 32 -2 70Z" fill="#111111" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
</g>

<!-- edge fade so text columns stay calm -->
<rect x="0" y="0" width="760" height="1200" fill="url(#fade)" transform="scale(-1 1) translate(-760 0)" opacity="0.5"/>
</svg>